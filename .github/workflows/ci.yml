name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          - python-version: "3.12"
            os: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Pure renderer, zero runtime deps. Snapshot tests use a fixed chart dict, so
      # they run fully offline (no ephemeris, no network).
      - name: Install ephemvis + test deps
        run: python -m pip install ".[test]"

      - name: Lint (ruff)
        run: python -m ruff check src/ephemvis

      - name: Type-check (mypy)
        run: python -m mypy

      - name: Run tests (incl. SVG snapshots)
        run: python -m pytest -q
